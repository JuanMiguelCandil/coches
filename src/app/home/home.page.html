<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de coches
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de coches</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <img src="https://picsum.photos/400"
            alt="Imagen aleatoria" style="border-radius: 8px;"/>
        </ion-col>
        <ion-col size="8">
          <app-car-item *ngFor="let coche of listaDeCoches"
            [coche]="coche">
          </app-car-item>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>

</ion-content>
