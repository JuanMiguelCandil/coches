<ion-header [translucent]="true">

    <ion-toolbar>
      <ion-title size="large">Lista de coches</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <app-car-item *ngFor="let coche of listaDeCoches"
    [coche]="coche">
    </app-car-item>
  </ion-content>
