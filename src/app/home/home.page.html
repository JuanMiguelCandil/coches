<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-img src="assets/img/logo.jpg" class="logo"
        alt="Imagen del logo"></ion-img>
    </ion-buttons>
    <ion-title>
      Lista de coches
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="build-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de coches</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <!-- Contenido para añadir en: src/app/home/home.page.html (dentro de ion-content) -->

    <!-- FORMULARIO PARA AÑADIR TAREAS -->

    <ion-list>
      <!-- Marca -->
      <ion-item>
        <ion-input
          label="Marca"
          label-placement="floating"
          placeholder="Ej. Toyota"
          [(ngModel)]="nuevoCoche.marca">
        </ion-input>
      </ion-item>

      <!-- Modelo -->
      <ion-item>
        <ion-input
          label="Modelo"
          label-placement="floating"
          placeholder="Ej. Corolla"
          [(ngModel)]="nuevoCoche.modelo">
        </ion-input>
      </ion-item>

      <!-- Caballos -->
      <ion-item>
        <ion-input
          type="number"
          label="Caballos"
          label-placement="floating"
          placeholder="Ej. 132"
          [(ngModel)]="nuevoCoche.caballos">
        </ion-input>
      </ion-item>

      <!-- Kilómetros -->
      <ion-item>
        <ion-input
          type="number"
          label="Kilómetros"
          label-placement="floating"
          placeholder="Ej. 52000"
          [(ngModel)]="nuevoCoche.kilometros">
        </ion-input>
      </ion-item>

      <!-- Imagén -->
      <ion-item>
        <ion-input
          label="Imagén"
          label-placement="floating"
          placeholder="Ej. 'https://url.imagen.com'"
          [(ngModel)]="nuevoCoche.imagen">
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button
      expand="block"
      (click)="agregarCoche()"
      class="ion-margin-top ion-margin-bottom">
      Añadir coche
    </ion-button>

    <!-- Toasts -->
    <ion-button expand="block" (click)="mostrarToast()">Toast</ion-button>
    <ion-button expand="block" (click)="mostrarAlertaSimple()" color="secondary">Alerta Info</ion-button>
    <ion-button expand="block" (click)="mostrarAlertaConfirmacion()" color="danger">Alerta Confirmar</ion-button>
    <ion-button expand="block" (click)="abrirModal()" color="warning">Abrir Modal</ion-button>

    <ion-grid>
      <ion-row>
        <ion-col *ngFor="let coche of listaDeCoches" size="12" size-md="6"
          size-lg="4" size-xl="3">
          <app-car-item [coche]="coche"></app-car-item>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>
</ion-content>
