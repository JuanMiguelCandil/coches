<ion-card class="card-sombreada">
  <ion-card-header>
    <ion-img [src]="coche.imagen" [alt]="coche.marca + ' ' + coche.modelo"></ion-img>
    <ion-card-title>{{coche.marca}} {{coche.modelo}}</ion-card-title>
  </ion-card-header>
  <ion-item class="card-sombreada">
    <ion-label>
      Caballos: {{ coche.caballos }} cv <br>
      Kilometros: {{ coche.kilometros }} km
    </ion-label>
  </ion-item>
</ion-card>
