<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de coches
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de coches</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col *ngFor="let coche of listaDeCoches" size="12" size-md="6" size-lg="4" size-xl="3">
          <app-car-item [coche]="coche"></app-car-item>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>
</ion-content>
