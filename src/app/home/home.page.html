
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <img src="assets/img/logo.jpg" class="logo"
        alt="Imagen del logo" />
    </ion-buttons>

    <ion-title>
      Lista de coches
    </ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="build-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de coches</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- SKELETON -->
  <div *ngIf="cargando">
    <ion-list>
      <ion-item *ngFor="let i of [1, 2, 3]">
        <ion-checkbox slot="start" disabled="true"></ion-checkbox>
        <ion-label>
          <h3>
            <ion-skeleton-text
              [animated]="true"
              style="width: 80%;">
            </ion-skeleton-text>
          </h3>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <!-- CONTENIDO REAL -->
  <div *ngIf="!cargando" class="ion-padding">

    <!-- FORMULARIO PARA AÑADIR TAREAS -->
    <ion-list>

      <!-- Marca -->
      <ion-item>
        <ion-input
          label="Marca"
          label-placement="floating"
          placeholder="Ej. Toyota"
          [(ngModel)]="nuevoCoche.marca">
        </ion-input>
      </ion-item>

      <!-- Modelo -->
      <ion-item>
        <ion-input
          label="Modelo"
          label-placement="floating"
          placeholder="Ej. Corolla"
          [(ngModel)]="nuevoCoche.modelo">
        </ion-input>
      </ion-item>

      <!-- Caballos -->
      <ion-item>
        <ion-input
          type="number"
          label="Caballos"
          label-placement="floating"
          placeholder="Ej. 132"
          [(ngModel)]="nuevoCoche.caballos">
        </ion-input>
      </ion-item>

      <!-- Kilómetros -->
      <ion-item>
        <ion-input
          type="number"
          label="Kilómetros"
          label-placement="floating"
          placeholder="Ej. 52000"
          [(ngModel)]="nuevoCoche.kilometros">
        </ion-input>
      </ion-item>

      <!-- Imagen -->
      <ion-item>
        <ion-input
          label="Imagen"
          label-placement="floating"
          placeholder="Ej. 'https://url.imagen.com'"
          [(ngModel)]="nuevoCoche.imagen">
        </ion-input>
      </ion-item>

    </ion-list>

    <ion-button
      expand="block"
      (click)="agregarCoche()"
      class="ion-margin-top ion-margin-bottom">
      Añadir coche
    </ion-button>

    <!-- Toasts -->
    <ion-button expand="block" (click)="mostrarToast()">
      Toast
    </ion-button>

    <ion-button
      expand="block"
      (click)="mostrarAlertaSimple()"
      color="secondary">
      Alerta Info
    </ion-button>

    <ion-button
      expand="block"
      (click)="mostrarAlertaConfirmacion()"
      color="danger">
      Alerta Confirmar
    </ion-button>

    <ion-button
      expand="block"
      (click)="abrirModal()"
      color="warning">
      Abrir Modal
    </ion-button>

    <!-- LISTA DE COCHES -->
    <ion-grid>
      <ion-row>
        <ion-col
          *ngFor="let coche of listaDeCoches"
          size="12"
          size-md="6"
          size-lg="4"
          size-xl="3">

          <app-car-item [coche]="coche"></app-car-item>

        </ion-col>
      </ion-row>
    </ion-grid>

  </div>

</ion-content>
