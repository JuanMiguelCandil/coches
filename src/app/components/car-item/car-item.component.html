<ion-card>
  <img src="{{coche.imagen}}" width="100%" />
  <ion-card-header>
    <ion-card-title>{{coche.marca}} {{coche.modelo}}</ion-card-title>
  </ion-card-header>
  <ion-item>
    <ion-label>
      Caballos: {{ coche.caballos }} cv <br>
      Kilometros: {{ coche.kilometros }} km
    </ion-label>
  </ion-item>
</ion-card>
